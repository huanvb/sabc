<svg viewBox="0 0 1380 826" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ hai khung: Khung trái giải thích cơ chế thiền FA và OM điều chỉnh trọng số độ chính xác của não dự báo (Clark 2023, Laukkonen &amp; Slagter 2021) và phân biệt Altered States với Altered Traits (Goleman &amp; Davidson 2017). Khung phải đối chiếu bằng chứng thực nghiệm: cỡ hiệu ứng d=0,30-0,38 (Goyal 2014, Galante 2021), bác bỏ làm dày vỏ não sau 8 tuần (Kral et al. 2022 N=218), và lưu ý tác dụng phụ 6-14% (Britton 2021)."><style>
