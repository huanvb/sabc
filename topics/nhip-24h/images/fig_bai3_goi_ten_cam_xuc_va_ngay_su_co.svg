<svg viewBox="0 0 1380 895" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ ba cột: So sánh đè nén cảm xúc (Gross 2015) với gọi tên cảm xúc kích hoạt vlPFC làm dịu hạch hạnh nhân (Lieberman 2007), tự nói ngôi thứ ba (Kross 2014), kỹ thuật Buông dây (Drop the Rope - ACT / Schonbrun 2026) và 4 nguyên tắc xử lý sự cố lúc 2 giờ sáng."><style>
