<svg viewBox="0 0 1380 860" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ hai khung: Khung trái trình bày ba mạng não CEN, SN (với nguồn gốc cảm xúc thân não PAG/RAS của Solms 2021) và DMN (khi tự do phát sóng SPW-Rs của Buzsáki 2019 đối lập với khi bị khóa bởi nghiền ngẫm sgPFC). Khung phải trình bày chu trình 4 pha siêu nhận thức của Hasenkamp 2012 kết hợp chú ý tiêu điểm và nhận biết ngoại vi của Culadasa 2017."><style>
