    --ink: #2b2f36;
    --sub: #6b7280;
    --flow: #8a94a3;
    --grid: rgba(138,148,163,0.24);
    --row: rgba(107,114,128,0.06);
    --card: #f8fafc;
    --ok: #2f9e5f;
    --okText: #248a4e;
    --okSoft: rgba(47,158,95,0.08);
    --warn: #b98a2e;
    --warnText: #8f6a22;
    --warnSoft: rgba(185,138,46,0.10);
    --bad: #c0554d;
    --badText: #b0463e;
    --badSoft: rgba(192,85,77,0.08);
    --accent: #e07828;
    --accentText: #b45f1e;
    --accentSoft: rgba(224,120,40,0.08);
    --info: #3f7fb8;
    --infoText: #356a9c;
    --infoSoft: rgba(63,127,184,0.08);
    --onwarn: #2b2f36;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #1b1e23;
      --ink: #e8ebef;
      --sub: #9aa0a8;
      --flow: #7d8794;
      --grid: rgba(125,135,148,0.25);
      --row: rgba(154,160,168,0.08);
      --card: #22262d;
      --ok: #3fb473;
      --okText: #5cc98a;
      --okSoft: rgba(63,180,115,0.14);
      --warn: #d3ab52;
      --warnText: #d3ab52;
      --warnSoft: rgba(211,171,82,0.14);
      --bad: #cf6a60;
      --badText: #cf6a60;
      --badSoft: rgba(207,106,96,0.15);
      --accent: #e0925a;
      --accentText: #e0925a;
      --accentSoft: rgba(224,146,90,0.14);
      --info: #6aa0d0;
      --infoText: #6aa0d0;
      --infoSoft: rgba(106,160,208,0.14);
      --onwarn: #1b1e23;
    }
  }
  .bg { fill: var(--bg); }
  text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .ttl { font-size: 23px; font-weight: 700; fill: var(--ink); }
  .sub1 { font-size: 14.5px; font-weight: 600; fill: var(--accentText); }
  .src { font-size: 12.5px; font-weight: 500; fill: var(--sub); }
  .cap { font-size: 14px; font-weight: 600; font-style: italic; fill: var(--sub); }
  .sec { font-size: 15.5px; font-weight: 700; fill: var(--ink); }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--sub); }
  .tag-ok { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--okText); }
  .tag-warn { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--warnText); }
  .tag-bad { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--badText); }
  .tag-accent { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--accentText); }
  .tag-info { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--infoText); }
  .bh { font-size: 14.5px; font-weight: 700; fill: var(--ink); }
  .bh-ok { font-size: 14.5px; font-weight: 700; fill: var(--okText); }
  .bh-warn { font-size: 14.5px; font-weight: 700; fill: var(--warnText); }
  .bh-bad { font-size: 14.5px; font-weight: 700; fill: var(--badText); }
  .bh-accent { font-size: 14.5px; font-weight: 700; fill: var(--accentText); }
  .bh-info { font-size: 14.5px; font-weight: 700; fill: var(--infoText); }
  .body { font-size: 12.5px; font-weight: 500; fill: var(--ink); }
  .sub { font-size: 12px; font-weight: 500; fill: var(--sub); }
  .motto { font-size: 12px; font-style: italic; font-weight: 600; fill: var(--sub); }
  .b-neutral { fill: var(--row); stroke: var(--flow); stroke-width: 1.8; }
  .b-panel { fill: none; stroke: var(--flow); stroke-width: 1.6; }
  .b-ok { fill: var(--okSoft); stroke: var(--ok); stroke-width: 1.9; }
  .b-warn { fill: var(--warnSoft); stroke: var(--warn); stroke-width: 1.9; }
  .b-bad { fill: var(--badSoft); stroke: var(--bad); stroke-width: 1.9; }
  .b-accent { fill: var(--accentSoft); stroke: var(--accent); stroke-width: 1.9; }
  .b-info { fill: var(--infoSoft); stroke: var(--info); stroke-width: 1.9; }
  .b-ok-dash { fill: var(--okSoft); stroke: var(--ok); stroke-width: 1.9; stroke-dasharray: 6 5; }
  .b-warn-dash { fill: var(--warnSoft); stroke: var(--warn); stroke-width: 1.9; stroke-dasharray: 6 5; }
  .b-bad-dash { fill: var(--badSoft); stroke: var(--bad); stroke-width: 1.9; stroke-dasharray: 6 5; }
  .b-accent-dash { fill: var(--accentSoft); stroke: var(--accent); stroke-width: 1.9; stroke-dasharray: 6 5; }
  .b-info-dash { fill: var(--infoSoft); stroke: var(--info); stroke-width: 1.9; stroke-dasharray: 6 5; }
  .flow-line { stroke: var(--flow); stroke-width: 2; fill: none; }
  .flow-dash { stroke: var(--flow); stroke-width: 2; stroke-dasharray: 6 5; fill: none; }
  .ok-line { stroke: var(--ok); stroke-width: 2.2; fill: none; }
  .warn-line { stroke: var(--warn); stroke-width: 2.2; fill: none; }
  .warn-dash { stroke: var(--warn); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
  .bad-line { stroke: var(--bad); stroke-width: 2.2; fill: none; }
  .bad-dash { stroke: var(--bad); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
  .accent-line { stroke: var(--accent); stroke-width: 2.2; fill: none; }
  .accent-dash { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
  .info-line { stroke: var(--info); stroke-width: 2.2; fill: none; }
  .div-line { stroke: var(--grid); stroke-width: 1.2; }
  .badge-warn { fill: var(--warn); stroke: var(--bg); stroke-width: 1.8; }
  .badge-bad { fill: var(--bad); stroke: var(--bg); stroke-width: 1.8; }
  .badge-ok { fill: var(--ok); stroke: var(--bg); stroke-width: 1.8; }
  .badge-info { fill: var(--info); stroke: var(--bg); stroke-width: 1.8; }
  .badge-accent { fill: var(--accent); stroke: var(--bg); stroke-width: 1.8; }
  .bang { font-size: 13px; font-weight: 800; fill: var(--onwarn); }
  .bang-light { font-size: 12px; font-weight: 800; fill: var(--bg); }
</style>
  <defs>
    <marker id="arr-flow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--flow)"/>
    </marker>
    <marker id="arr-ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--ok)"/>
    </marker>
    <marker id="arr-warn" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--warn)"/>
    </marker>
    <marker id="arr-bad" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--bad)"/>
    </marker>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--accent)"/>
    </marker>
    <marker id="arr-info" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--info)"/>
    </marker>
  </defs>
<rect class="bg" x="0" y="0" width="1380" height="860" rx="14"/><text x="36.0" y="38.0" class="ttl">Mạng nổi bật (SN) đọc tín hiệu nội thân để chuyển pha giữa mạng mặc định (DMN) và mạng điều hành (CEN)</text><text x="36.0" y="72.0" class="sub1">Kiến trúc ba mạng lưới thần kinh (Triple Network Model), nguồn gốc cảm xúc thân não và chu trình 4 pha siêu nhận thức</text><text x="36.0" y="96.0" class="src">Nguồn đối chiếu: Raichle (2001) · Menon (2011) · Hasenkamp et al. (2012) · Brewer et al. (2011) · Buzsáki (2019 SPW-Rs) · Mark Solms (2021 PAG/RAS) · Culadasa (2017)</text><rect x="36.0" y="127.0" width="669.8" height="636.0" rx="12" class="b-panel"/><text x="52.0" y="149.0" class="tag">KHUNG TRÁI · KIẾN TRÚC 3 MẠNG LƯỚI &amp; THÂN NÃO</text><text x="52.0" y="168.0" class="sec">1. Ba mạng não trong ngày điều phối tác nhân AI</text><line x1="52.0" y1="177.0" x2="689.8" y2="177.0" class="div-line"/><rect x="52.0" y="187.0" width="637.8" height="126.0" rx="12" class="b-info"/><text x="68.0" y="212.0" class="tag-info">MẠNG ĐIỀU HÀNH TRUNG ƯƠNG (CEN) · dlPFC &amp; THÙY ĐỈNH SAU (PPC)</text><text x="68.0" y="233.0" class="bh-info">1. Giữ mô hình logic, đọc mã &amp; kiểm định Nguồn Chân Lý</text><text x="68.0" y="257.0" class="body">• Duy trì các ràng buộc kỹ thuật trong trí nhớ làm việc có dung lượng hữu hạn.</text><text x="68.0" y="279.0" class="body">• Quá tải thời AI: Chuyển cửa sổ mỗi ~47 giây giữa 8–12 tác nhân buộc CEN nạp lại quy tắc</text><text x="68.0" y="296.0" class="body">liên tục, làm mỏng khả năng phát hiện lỗi lệch ngầm.</text><rect x="52.0" y="325.0" width="637.8" height="143.0" rx="12" class="b-warn"/><text x="68.0" y="350.0" class="tag-warn">MẠNG NỔI BẬT (SN — 'NGƯỜI NHẠC TRƯỞNG') · THÙY ĐẢO TRƯỚC &amp; dACC</text><text x="68.0" y="371.0" class="bh-warn">2. Công tắc chuyển mạch &amp; Nguồn gốc cảm xúc thân não (Solms 2021)</text><text x="68.0" y="395.0" class="body">• Đọc tín hiệu nội thân (nhịp tim, hơi thở, độ khát, căng cơ) dẫn truyền từ thân não — chất</text><text x="68.0" y="412.0" class="body">xám quanh cống não (PAG) và hệ lưới hoạt hóa (RAS) theo Mark Solms (2021).</text><text x="68.0" y="434.0" class="body">• Bật sáng đúng khoảnh khắc nhận ra tâm đi lạc (Meta-awareness) để điều phối chuyển pha</text><text x="68.0" y="451.0" class="body">giữa DMN và CEN.</text><rect x="52.0" y="480.0" width="637.8" height="121.0" rx="12" class="b-ok"/><text x="68.0" y="505.0" class="tag-ok">MẠNG MẶC ĐỊNH (DMN) KHI TỰ DO · mPFC, PCC &amp; ĐỒI HẢI MÃ</text><text x="68.0" y="526.0" class="bh-ok">3a. Khi lành mạnh: Tự sự bản sắc &amp; Gợn sóng sắc nét (SPW-Rs · Buzsáki 2019)</text><text x="68.0" y="550.0" class="body">• Khi có khoảng nghỉ không tải, đồi hải mã và vỏ não phát gợn sóng sắc nét (Sharp-Wave</text><text x="68.0" y="567.0" class="body">Ripples — SPW-Rs) nén thời gian 10–20 lần để phát lại (replay) ký ức và thử nghiệm tương</text><text x="68.0" y="584.0" class="body">lai (preplay).</text><rect x="52.0" y="613.0" width="637.8" height="142.0" rx="12" class="b-bad-dash"/><text x="68.0" y="638.0" class="tag-bad">MẠNG MẶC ĐỊNH (DMN) KHI BỊ KHÓA · PCC &amp; VỎ NÃO DƯỚI GỐI (sgPFC)</text><text x="68.0" y="659.0" class="bh-bad">3b. Khi kẹt trong nghiền ngẫm (Rumination): Ba nguồn nhiên liệu gây kẹt</text><text x="68.0" y="683.0" class="body">• Bị kéo cứng bởi: (1) Cặn chú ý của các nhánh AI dang dở (Leroy 2009), (2) Bí mật/chỗ chưa</text><text x="68.0" y="700.0" class="body">hiểu giấu kín (Slepian; John 2026), (3) Cơn bực khi tác nhân lệch ngầm.</text><line x1="68.0" y1="709.0" x2="673.8" y2="709.0" class="div-line"/><text x="68.0" y="725.0" class="motto">Không cần 'tắt DMN', mà cần gỡ nhiên liệu gây kẹt và tăng kết nối giám sát linh hoạt giữa PCC</text><text x="68.0" y="741.0" class="motto">với dACC/dlPFC (Brewer 2011).</text><rect x="725.8" y="127.0" width="618.2" height="636.0" rx="12" class="b-panel"/><text x="741.8" y="149.0" class="tag">KHUNG PHẢI · CHU TRÌNH 4 PHA (HASENKAMP 2012; CULADASA 2017)</text><text x="741.8" y="168.0" class="sec">2. Vòng lặp rèn siêu nhận thức &amp; giữ nhận biết ngoại vi</text><line x1="741.8" y1="177.0" x2="1328.0" y2="177.0" class="div-line"/><rect x="741.8" y="187.0" width="586.2" height="121.0" rx="12" class="b-accent-dash"/><text x="757.8" y="212.0" class="tag-accent">PHA 1: TÂM ĐI LẠC (MIND-WANDERING) · DMN TĂNG (PCC &amp; mPFC)</text><text x="757.8" y="233.0" class="bh-accent">Tách rời tri giác (Perceptual Decoupling · Schooler 2011)</text><text x="757.8" y="257.0" class="body">• Mắt vẫn nhìn màn hình hoặc dòng log nhưng tâm trí đã trôi sang nhánh việc khác</text><text x="757.8" y="274.0" class="body">hoặc lo âu. Mất cân bằng giữa Chú ý tiêu điểm (Focal Attention) và Nhận biết ngoại</text><text x="757.8" y="291.0" class="body">vi (Peripheral Awareness · Culadasa 2017).</text><rect x="741.8" y="320.0" width="586.2" height="121.0" rx="12" class="b-warn"/><text x="757.8" y="345.0" class="tag-warn">PHA 2: NHẬN RA (META-AWARENESS) · MẠNG SN BẬT SÁNG (THÙY ĐẢO &amp; dACC)</text><text x="757.8" y="366.0" class="bh-warn">Khoảnh khắc tỉnh thức: 'À, mình đang đi lạc / đang sốt ruột!'</text><text x="757.8" y="390.0" class="body">• Nhờ Nhận biết ngoại vi (Peripheral Awareness) canh gác bối cảnh, mạng SN phát</text><text x="757.8" y="407.0" class="body">hiện độ lệch nội thân và bật công tắc siêu nhận thức. Đây chính là 1 lần tập cơ bắp</text><text x="757.8" y="424.0" class="body">chuyển pha.</text><rect x="741.8" y="453.0" width="586.2" height="104.0" rx="12" class="b-info"/><text x="757.8" y="478.0" class="tag-info">PHA 3: CHUYỂN HƯỚNG CHÚ Ý (SHIFTING) · MẠNG CEN KÍCH HOẠT (dlPFC &amp; PPC)</text><text x="757.8" y="499.0" class="bh-info">Gọi tên cảm xúc, thở ra chậm &amp; tháo gỡ sự cuốn vào PCC</text><text x="757.8" y="523.0" class="body">• Chủ động gọi tên trạng thái (Lieberman 2007), buông câu chuyện đang kéo đi và nhẹ</text><text x="757.8" y="540.0" class="body">nhàng đưa tiêu điểm chú ý rời khỏi vòng lặp tự quy chiếu.</text><rect x="741.8" y="569.0" width="586.2" height="142.0" rx="12" class="b-ok"/><text x="757.8" y="594.0" class="tag-ok">PHA 4: DUY TRÌ CHÚ Ý (SUSTAINING) · GIỮ TIÊU ĐIỂM TẠI dlPFC</text><text x="757.8" y="615.0" class="bh-ok">Ổn định Chú ý tiêu điểm song hành cùng Nhận biết ngoại vi</text><text x="757.8" y="639.0" class="body">• Nâng trọng số độ chính xác cho đối tượng hiện tại (hơi thở hoặc Nguồn Chân Lý của</text><text x="757.8" y="656.0" class="body">nhánh chính), giữ nhận biết ngoại vi mở để không bị đóng băng cục bộ.</text><line x1="757.8" y1="665.0" x2="1312.0" y2="665.0" class="div-line"/><text x="757.8" y="681.0" class="motto">Giao bản ghi 3 phần cho LLM trước khi chuyển việc giúp rút bớt nhiên liệu kéo tâm đi</text><text x="757.8" y="697.0" class="motto">lạc ở Pha 1.</text><path d="M 1328.0 698.0 C 1354.0 658.0, 1354.0 262.0, 1328.0 222.0" class="accent-dash" marker-end="url(#arr-accent)"/><line x1="707.8" y1="357.0" x2="721.8" y2="357.0" class="warn-line" marker-end="url(#arr-warn)"/><text x="36.0" y="795.0" class="src">Quy ước: Xanh dương (info) = Mạng điều hành CEN; Vàng (warn) = Mạng nổi bật SN &amp; Pha Nhận ra; Xanh lá (ok) = DMN tự do / SPW-Rs &amp; Pha Duy trì; Đỏ nét đứt = DMN kẹt nghiền ngẫm.</text><line x1="36.0" y1="805.0" x2="1344.0" y2="805.0" class="div-line"/><text x="690.0" y="827.0" class="cap" text-anchor="middle">Kết luận: Mỗi lần nhận ra tâm đi lạc (Pha 2) không phải là thất bại, mà là một lần mạng Nổi bật (SN) đọc tín hiệu nội thân để rèn bản lề chuyển pha giữa DMN và CEN.</text></svg>