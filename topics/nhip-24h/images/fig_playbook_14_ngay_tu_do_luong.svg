<svg viewBox="0 0 1380 770" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ thử nghiệm tự đo lường 14 ngày gồm 3 cột: Tuần 1 (Ngày 1-7) đo đường cơ sở không can thiệp; Tuần 2 (Ngày 8-14) áp dụng 3 chốt chặn gồm Bản ghi 3 phần, dời giờ ngừng caffeine kèm ngủ trưa 10 phút, và chốt giờ đóng máy tối; Cột 3 liệt kê 5 chỉ số chấm trong 60 giây mỗi tối để tìm ra ngưỡng số tác nhân và giờ ngừng caffeine của riêng mình."><style>
