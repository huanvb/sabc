<svg viewBox="0 0 1380 802" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ ba cột: Khi việc sinh mã tiến gần miễn phí, nút cổ chai dịch chuyển sang sự chú ý của con người và Nguồn Chân Lý ở tầng tính toán Marr Level 1, đối lập với tàn dư tự hồi quy ở tầng 2-3 của LLM, cùng bảng phân chia cổng máy tự kiểm và cổng người bắt buộc duyệt."><style>
  svg {
