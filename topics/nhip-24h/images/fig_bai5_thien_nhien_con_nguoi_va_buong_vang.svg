<svg viewBox="0 0 1380 837" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ hai khung: Khung trái trình bày bằng chứng đi bộ tự nhiên 60-90 phút làm giảm hoạt động vùng nghiền ngẫm sgPFC (Bratman 2015) và Amygdala (Sudimac 2022). Khung phải trình bày lý trí đối thoại (Mercier &amp; Sperber 2011: Wason 10-15% lên 70-80%), hỏi trực tiếp vượt trội tự đoán (Perspective-Getting &gt; Perspective-Taking, Eyal &amp; Epley 2018), cơ chế leo thang lực trả đũa (Shergill 2003), lắng nghe chất lượng cao (Itzchakov 2024) và Revealing/Vibe/Mattering (2026)."><style>
