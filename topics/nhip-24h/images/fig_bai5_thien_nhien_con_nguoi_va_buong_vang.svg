  .bad-line { stroke: var(--bad); stroke-width: 2.2; fill: none; }
  .bad-dash { stroke: var(--bad); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
  .accent-line { stroke: var(--accent); stroke-width: 2.2; fill: none; }
  .accent-dash { stroke: var(--accent); stroke-width: 2.2; stroke-dasharray: 6 5; fill: none; }
