<svg viewBox="0 0 1380 803" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ ba cột: Khối 1 trình bày đường dẫn nội thân qua Thùy đảo trước (Craig 2009, Clark 2023, Solms 2021) và quy gán sai nội cảm khi đói (Hangry - MacCormack &amp; Lindquist 2019; Swami 2022 giải thích 37% cáu kỉnh). Khối 2 trình bày bằng chứng giữ nước (Wittbrodt 2018 mất nước &gt;=2%), ăn Hara Hachi Bu và lọc bỏ lời đồn thiếu bằng chứng. Khối 3 trình bày vận động lồng ghép vào khe chuyển phiên (Chang 2012, WHO 2020, McGonigal 2026)."><style>
