  .sub1 { font-size: 14.5px; font-weight: 600; fill: var(--accentText); }
  .src { font-size: 12.5px; font-weight: 500; fill: var(--sub); }
  .cap { font-size: 14px; font-weight: 600; font-style: italic; fill: var(--sub); }
  .sec { font-size: 15.5px; font-weight: 700; fill: var(--ink); }
  .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--sub); }
  .tag-ok { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--okText); }
  .tag-warn { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--warnText); }
  .tag-bad { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--badText); }
  .tag-accent { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--accentText); }
  .tag-info { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; fill: var(--infoText); }
  .bh { font-size: 14.5px; font-weight: 700; fill: var(--ink); }
  .bh-ok { font-size: 14.5px; font-weight: 700; fill: var(--okText); }
  .bh-warn { font-size: 14.5px; font-weight: 700; fill: var(--warnText); }
  .bh-bad { font-size: 14.5px; font-weight: 700; fill: var(--badText); }
  .bh-accent { font-size: 14.5px; font-weight: 700; fill: var(--accentText); }
  .bh-info { font-size: 14.5px; font-weight: 700; fill: var(--infoText); }
  .body { font-size: 12.5px; font-weight: 500; fill: var(--ink); }
  .sub { font-size: 12px; font-weight: 500; fill: var(--sub); }
  .motto { font-size: 12px; font-style: italic; font-weight: 600; fill: var(--sub); }
  .b-neutral { fill: var(--row); stroke: var(--flow); stroke-width: 1.8; }
  .b-panel { fill: none; stroke: var(--flow); stroke-width: 1.6; }
