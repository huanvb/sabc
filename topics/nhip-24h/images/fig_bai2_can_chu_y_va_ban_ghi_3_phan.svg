<svg viewBox="0 0 1380 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ ba cột: Khối 1 giải thích chi phí chuyển đổi (Monsell 2003) và cặn chú ý (Leroy 2009, 2018; Masicampo &amp; Baumeister 2011). Khối 2 trình bày cấu trúc Bản ghi 3 phần (Đã chốt, Đang mở, Bước tiếp theo) cộng 1 dòng cảm xúc và 3 giới hạn khi giao cho LLM. Khối 3 trình bày 3 tầng nghi thức chuyển tiếp 30 giây, 3 phút (giữ khoảng trống cho SPW-Rs của Buzsáki 2019) và 10 phút đóng ngày."><style>
  svg {
