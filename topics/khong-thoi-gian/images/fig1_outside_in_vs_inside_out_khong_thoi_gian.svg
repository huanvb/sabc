<svg viewBox="0 0 1420 927" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sơ đồ ba cột so sánh mô hình Từ ngoài vào trong (Outside-In của Newton, Kant, William James 1890) với sự thật sinh học - nhân học (0 thụ thể cảm nhận không gian hay thời gian; bằng chứng từ bộ tộc Amondawa, Kuuk Thaayorre, Wintu và Aymara) và kiến trúc Từ trong ra ngoài (Inside-Out của Buzsáki 2019 và Rovelli 2026) với chuỗi quỹ đạo nơ-ron nội sinh, hành động chủ động, phóng điện hệ quả và các mối quan hệ kề cận."><style>
  svg {
    --bg: #ffffff;
    --ink: #2b2f36;
    --sub: #6b7280;
    --flow: #8a94a3;
    --grid: rgba(138,148,163,0.24);
    --row: rgba(107,114,128,0.06);
    --card: #f8fafc;
    --ok: #2f9e5f;
    --okText: #248a4e;
    --okSoft: rgba(47,158,95,0.08);
    --warn: #b98a2e;
    --warnText: #8f6a22;
    --warnSoft: rgba(185,138,46,0.10);
    --bad: #c0554d;
    --badText: #b0463e;
    --badSoft: rgba(192,85,77,0.08);
    --accent: #e07828;
    --accentText: #b45f1e;
    --accentSoft: rgba(224,120,40,0.08);
    --info: #3f7fb8;
    --infoText: #356a9c;
    --infoSoft: rgba(63,127,184,0.08);
    --onwarn: #2b2f36;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --bg: #1b1e23;
      --ink: #e8ebef;
      --sub: #9aa0a8;
      --flow: #7d8794;
      --grid: rgba(125,135,148,0.25);
      --row: rgba(154,160,168,0.08);
      --card: #22262d;
      --ok: #3fb473;
      --okText: #5cc98a;
      --okSoft: rgba(63,180,115,0.14);
      --warn: #d3ab52;
      --warnText: #d3ab52;
      --warnSoft: rgba(211,171,82,0.14);
      --bad: #cf6a60;
      --badText: #cf6a60;
      --badSoft: rgba(207,106,96,0.15);
      --accent: #e0925a;
      --accentText: #e0925a;
      --accentSoft: rgba(224,146,90,0.14);
      --info: #6aa0d0;
      --infoText: #6aa0d0;
      --infoSoft: rgba(106,160,208,0.14);
      --onwarn: #1b1e23;
    }
  }
