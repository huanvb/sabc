<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#242220"/>
      <stop offset="100%" stop-color="#141312"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark rounded tile -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Connecting trajectory arc: Step 1 -> Step 2 -> Step 3 -->
  <path d="M 18 46 Q 30 38 46 18" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3"/>

  <!-- Node 1: STOP (Bottom-Left, Red) -->
  <g filter="url(#shadow)">
    <circle cx="18" cy="46" r="10" fill="#d1495b"/>
    <!-- Stop square -->
    <rect x="15" y="43" width="6" height="6" rx="1" fill="#ffffff"/>
  </g>

  <!-- Node 2: ASK (Center, Warm Amber) -->
  <g filter="url(#shadow)">
    <circle cx="32" cy="32" r="10" fill="#d9902b"/>
    <!-- Question mark glyph -->
    <path d="M 30.5 28.2 C 30.5 26.6 31.4 25.8 32.8 25.8 C 34.2 25.8 35.1 26.6 35.1 27.8 C 35.1 29 34.2 29.7 33.4 30.3 C 32.8 30.7 32.3 31.3 32.3 32.2" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="32.3" cy="35.2" r="1.1" fill="#ffffff"/>
  </g>

  <!-- Node 3: BEGIN (Top-Right, Emerald Green) -->
  <g filter="url(#shadow)">
    <circle cx="46" cy="18" r="10" fill="#2e9e6b"/>
    <!-- Forward play triangle -->
    <polygon points="43.5,13.5 43.5,22.5 51,18" fill="#ffffff"/>
  </g>
</svg>